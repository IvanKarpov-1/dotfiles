[config]

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-matugen.conf'
output_path = '~/.config/kitty/themes/matugen.conf'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland-matugen.conf'
output_path = '~/.config/hypr/colors.conf'
post_hook = 'hyprctl reload'

[templates.waybar]
input_path = '~/.config/matugen/templates/colors-matugen.css'
output_path = '~/.config/waybar/colors.css'

[templates.waypaper]
input_path = '~/.config/matugen/templates/colors-matugen.css'
output_path = '~/.config/waypaper/colors.css'

[templates.rofi]
input_path = '~/.config/matugen/templates/rofi-matugen.rasi'
output_path = '~/.config/rofi/colors.rasi'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-matugen.css'
output_path = '~/.config/gtk-3.0/colors.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-matugen.css'
output_path = '~/.config/gtk-4.0/colors.css'

[templates.qt5ct]
input_path = '~/.config/matugen/templates/qt-matugen.colors'
output_path = '~/.local/share/color-schemes/Matugen.colors'

[templates.qt6ct]
input_path = '~/.config/matugen/templates/qt-matugen.colors'
output_path = '~/.local/share/color-schemes/Matugen.colors'

[templates.kvantum-config]
input_path = '~/.config/matugen/templates/kvantum-matugen.kvconfig'
output_path = '~/.config/Kvantum/Matugen/Matugen.kvconfig'

[templates.kvantum-svg]
input_path = '~/.config/matugen/templates/kvantum-matugen.svg'
output_path = '~/.config/Kvantum/Matugen/Matugen.svg'

[templates.pywalfox]
input_path = '~/.config/matugen/templates/pywalfox-matugen.json'
output_path = '~/.cache/wal/colors.json'

[templates.wlogout]
input_path = '~/.config/matugen/templates/colors-matugen.css'
output_path = '~/.config/wlogout/colors.css'

[templates.swaync]
input_path = '~/.config/matugen/templates/colors-matugen.css'
output_path = '~/.config/swaync/colors.css'

[templates.primary]
input_path = '~/.config/matugen/templates/color-primary-matugen'
output_path = '~/.config/mimic/colors/primary'

[templates.secondary]
input_path = '~/.config/matugen/templates/color-secondary-matugen'
output_path = '~/.config/mimic/colors/secondary'

[templates.on_surface]
input_path = '~/.config/matugen/templates/color-onsurface-matugen'
output_path = '~/.config/mimic/colors/onsurface'

# Read ~/.config/vivaldi/custom/README.md
[templates.vivaldi]
input_path = '~/.config/matugen/templates/vivaldi-matugen.css'
output_path = '~/.config/vivaldi/custom/colors.css'

[templates.sddm]
input_path = '~/.config/matugen/templates/sddm-matugen.conf'
output_path = '~/.config/sddm/sddm-matugen.conf'
