$backgroundAlpha = rgba({{ colors.background.default.hex_stripped }}aa)

<* if mode | replace: "Dark", "" *>
   $foreground = rgba({{ colors.surface.default.hex_stripped }}ff)
<* endif *>

<* if mode | replace: "Light", "" *>
    $foreground = rgba({{ colors.on_surface.default.hex_stripped }}ff)
<* endif *>

<* for name, value in colors *>
${{ name }} = rgba({{ value.default.hex_stripped }}ff)
<* endfor *>

