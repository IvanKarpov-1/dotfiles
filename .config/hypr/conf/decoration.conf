# See https://wiki.hyprland.org/Configuring/Variables/ for more
decoration {
    rounding = 5
    active_opacity = 1.0
    inactive_opacity = 0.9
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 3
        passes = 4
        new_optimizations = on
        ignore_opacity = true
        xray = true
    }
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = $shadow
    }
}

layerrule = blur on, match:namespace waybar

layerrule = no_anim on, match:namespace ^(rofi)$
layerrule = blur on, match:namespace ^(rofi)$
layerrule = xray 1, match:namespace ^(rofi)$

layerrule = blur on, match:namespace swaync-control-center
# layerrule = xray, swaync-control-center
layerrule = animation slide right, match:namespace swaync-control-center
layerrule = ignore_alpha 0.4, match:namespace swaync-control-center

layerrule = blur on, match:namespace swaync-notification-window
# layerrule = xray, swaync-control-center
layerrule = animation slide right, match:namespace swaync-notification-window
layerrule = ignore_alpha 0.4, match:namespace swaync-notification-window
