# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

windowrule = match:title ^(Microsoft-edge)$, tile on
windowrule = match:title ^(Brave-browser)$, tile on
windowrule = match:title ^(Chromium)$, tile on
windowrule = match:title ^(pavucontrol)$, float on
windowrule = match:title ^(blueman-manager)$, float on
windowrule = match:title ^(nm-connection-editor)$, float on
windowrule = match:title ^(qalculate-gtk)$, float on

# Browser Picture in Picture
windowrule {
  name = windowrule-1
  float = on
  pin = on
  move = ((monitor_w*0.695)) ((monitor_h*0.04))
  match:title = ^(Picture-in-Picture)$
}


# idleinhibit
windowrule {
  name = windowrule-2
  idle_inhibit = fullscreen

  match:class = ([window]) # Available modes: none
}


#xwayland related rules
# when moving objects in resolve a large border is produced 
# This rule prevents that and serves as a template for any problematic xwayland apps
windowrule {
  name = windowrule-3
  no_blur = on
  match:class = ^(\bresolve\b)$
  match:xwayland = 1
}
# This is a general rule for xwayland apps but can have other consequences 
# for one user it impacted EMACs so it's disabled by default 
# It's here as a reference or for quick triage of xwayland ap
#windowrule = noblur, xwayland:1

# Float and center file pickers
windowrule {
  name = windowrule-4
  float = on
  center = 1
  match:class = xdg-desktop-portal-gtk
  match:title = ^(Open.*Files?|Open.*Folder?|Save.*Files?|All Files|Save|Save As)
}


windowrule {
  name = windowrule-5
  float = on
  center = 1
  match:class = xdg-desktop-portal-gtk
  match:title = ^(Відкрити.*файли?|Зберегти.*Файли?|Усі файли|Зберегти|Зберегти як|Зберегти файл)
}


windowrule {
  name = windowrule-6
  float = on
  center = 1
  match:class = Xdg-desktop-portal-gtk
  match:title = ^(Open.*Files?|Open.*Folder?|Save.*Files?|All Files|Save|Save As)
}


windowrule {
  name = windowrule-7
  float = on
  center = 1
  match:class = Xdg-desktop-portal-gtk
  match:title = ^(Відкрити.*файли?|Зберегти.*Файли?|Усі файли|Зберегти|Зберегти як|Зберегти файл)
}


# Center VS Code confirmation window
windowrule {
  name = windowrule-8
  center = 1
  match:title = ^(Visual Studio Code)
  match:float = 1
}


# Float and center Telegram's media viewer
windowrule {
  name = windowrule-9
  float = on
  center = 1
  match:class = org.telegram.desktop
  match:title = ^(Медіапереглядач|Mediaviewer)
}


# Float, center, adn no screen share for BitWarden
windowrule {
  name = windowrule-10
  float = on
  center = 1
  no_screen_share = on
  match:class = ^(Bitwarden)$
}

windowrule {
  name = windowrule-11
  float = on
  center = 1
  no_screen_share = on
  match:class = ^(vivaldi-stable)$ title:^(Bitwarden.*)
}

