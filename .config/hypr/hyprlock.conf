# Source colors
source = $HOME/.config/hypr/colors.conf

# General
general {
    screencopy_mode = 1
}

# Background
background {
    monitor =
    path = $HOME/.cache/mimic/hyprland-dotfiles/blurred_wallpaper.png
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 2
}

# Password input field
input-field {
    monitor = eDP-1
    size = 300, 50
    outline_thickness = 3
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    outer_color = $primary
    inner_color = $surface
    font_color = $on_surface
    capslock_color = $error
    check_color = $tertiary
    fail_color = $error # if authentication failed, changes outer_color and fail message color
    fade_on_empty = false
    font_family = JetBrains Nerd Font Propo
    fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = <span>󰢏  $USER</span> # Text rendered in the input box when it's empty.
    hide_input = false
    rounding = -1 # -1 means complete rounding (circle/oval)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
    fail_transition = 50 # transition time in ms between normal outer_color and fail_color
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off
    swap_font_color = false # see below
    position = 0, -20
    halign = center
    valign = center
}

