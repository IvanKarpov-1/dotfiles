# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = $foreground
    font_size = 55
    font_family = JetBrains Nerd Font Mono Semibold
    position = -100, 170
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

# Date
label {
    monitor =
    text = cmd[update:5000] date +"%A, %B %d"
    color = $foreground
    font_size = 17
    font_family = JetBrains Nerd Font Mono Semibold
    position = -100, 140
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

# User
label {
    monitor =
    text = $USER
    color = $foreground
    font_size = 24
    font_family = JetBrains Nerd Font Mono Semibold
    position = -100, 260
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}
